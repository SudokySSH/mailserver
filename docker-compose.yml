services:
  db:
    image: postgres:16-alpine
    container_name: aether-db
    env_file: .env.db
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  api:
    build: ./services/api
    container_name: aether-api
    env_file: .env.api
    environment:
      DATABASE_URL: postgres://aether:${DB_PASSWORD}@db:5432/aether
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: always

  audit-worker:
    build: ./services/audit-worker
    container_name: aether-audit-worker
    environment:
      API_INTERNAL: http://api:8080
      API_KEY: ${API_KEY}
    depends_on:
      - api
    restart: always

  frontend:
    build: ./frontend
    container_name: aether-frontend
    environment:
      API_INTERNAL: http://api:8080
      API_KEY: ${API_KEY}
    depends_on:
      - api
    restart: always

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.${MAIL_DOMAIN}
    env_file: .env.mail
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "2525:587"
      - "2526:587"
      - "2527:587"
    volumes:
      - ./data/mail:/var/mail
      - ./data/mail-state:/var/mail-state
      - ./config:/tmp/docker-mailserver
      - ./certs:/etc/letsencrypt:ro
    restart: always
    stop_grace_period: 1m
    healthcheck:
      test: "ss -lnt | grep -q ':25 ' || exit 1"
      interval: 30s
      retries: 5
      start_period: 60s

  panel:
    build: ./edge/panel
    container_name: mail-panel
    env_file: .env.panel
    environment:
      MAIL_HOST: mailserver
      AUDIT_URL: http://api:8080
      API_KEY: ${API_KEY}
      PANEL_PREFIX: /legacy
    volumes:
      - ./config:/mail-config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mailserver:
        condition: service_healthy
    restart: always

  nginx:
    image: openresty/openresty:alpine
    container_name: mail-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api
    restart: always
