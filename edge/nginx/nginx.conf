lua_shared_dict aether_ratelimit 10m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__MAIL_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_HOSTNAME__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'" always;

    client_max_body_size 25m;

    # Go API + Lua rate limit на входном периметре (спецификация §1, Lua)
    location /api/ {
        access_by_lua_block {
            local lim = ngx.shared.aether_ratelimit
            local key = "rl:" .. ngx.var.remote_addr
            local limit = 30
            if ngx.var.uri:find("login", 1, true) then
                limit = 5
            end
            local n = lim:get(key)
            if n and n >= limit then
                ngx.status = 429
                ngx.say('{"error":"rate limited"}')
                return ngx.exit(429)
            end
            lim:incr(key, 1, 0, 30)
        }
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Старая Python-панель — она сама знает свой префикс (PANEL_PREFIX=/legacy)
    # и генерирует ссылки/формы с ним, поэтому proxy_pass стрипает /legacy/.
    location /legacy/ {
        proxy_pass http://panel:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js фронтенд
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
